<!DOCTYPE html>
<html lang="en" lang="malayalam">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upload Prescription</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f2f6ff;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.container{
background:#fff;
padding:30px;
width:95%;
max-width:900px;
min-height:90vh;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.2);
text-align:center;
overflow:auto;
}

h2{
color:#2563eb;
}

button{
width:100%;
padding:15px;
margin:10px 0;
border:none;
border-radius:10px;
background:#2563eb;
color:white;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#1d4ed8;
}

img{
margin-top:20px;
max-width:100%;
border-radius:10px;
display:none;
}

iframe{
margin-top:20px;
width:100%;
height:400px;
display:none;
border:none;
}
</style>
<style>
.output{
    width:100%;
    min-height:250px;
    margin-top:20px;
    padding:20px;
    background:#f8f9fa;
    border:1px solid #ddd;
    border-radius:10px;

    white-space:pre-wrap;
    word-break:break-word;
    overflow-wrap:anywhere;
    overflow-x:auto;

    text-align:left;
    font-size:16px;
    line-height:1.7;
}
</style>

</head>

<body>

<div class="container">

<h2>📄 Upload Prescription</h2>

<button onclick="openCamera()">📷 Camera</button>

<button onclick="openGallery()">🖼 Gallery</button>

<button onclick="openPDF()">📄 PDF</button>

<input type="file"
id="galleryInput"
accept="image/*">

<img id="preview">

<button id="uploadBtn">
Analyze Prescription
</button>

<div id="output"></div>

<input
type="file"
id="cameraInput"
accept="image/*"
capture="environment"
style="display:none">

<input
type="file"
id="galleryInput"
accept="image/*"
style="display:none">

<input
type="file"
id="pdfInput"
accept="application/pdf"
style="display:none">

<img id="preview">
<h3 id="resultTitle">Extracted Text</h3>

<div id="ocrOutput" class="output"></div>
<iframe id="pdfViewer"></iframe>

</div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script type="module" src="upload.js"></script>
</body>
</html>
