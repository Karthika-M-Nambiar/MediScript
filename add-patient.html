<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add New Patient | MediScript</title>

    <link rel="stylesheet" href="style1.css">

    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

</head>

<body>

<div class="container">

    <div class="patient-card">

        <h1>➕ Add New Patient</h1>

        <p>Add a family member or another patient to your MediScript account.</p>

        <form id="patientForm">

            <!-- Profile Photo -->

            <div class="photo-section">

                <img src="images/default-profile.png"
                     id="previewImage"
                     class="profile-photo"
                     alt="Profile">

                <input type="file"
                       id="profilePhoto"
                       accept="image/*">

            </div>

            <!-- Personal Details -->

            <div class="form-grid">

                <div>

                    <label>Full Name *</label>

                    <input type="text"
                           id="fullName"
                           placeholder="Enter Full Name"
                           required>

                </div>

                <div>

                    <label>Relation to You *</label>

                    <select id="relation" required>

                        <option value="">Select</option>

                        <option>Self</option>
                        <option>Father</option>
                        <option>Mother</option>
                        <option>Brother</option>
                        <option>Sister</option>
                        <option>Husband</option>
                        <option>Wife</option>
                        <option>Son</option>
                        <option>Daughter</option>
                        <option>Grandfather</option>
                        <option>Grandmother</option>
                        <option>Friend</option>
                        <option>Other</option>

                    </select>

                </div>

                <div>

                    <label>Date of Birth</label>

                    <input type="date"
                           id="dob">

                </div>

                <div>

                    <label>Age *</label>

                    <input type="number"
                           id="age"
                           min="0"
                           required>

                </div>

                <div>

                    <label>Gender *</label>

                    <select id="gender">

                        <option>Male</option>
                        <option>Female</option>
                        <option>Other</option>

                    </select>

                </div>

                <div>

                    <label>Blood Group</label>

                    <select id="bloodGroup">

                        <option>A+</option>
                        <option>A-</option>
                        <option>B+</option>
                        <option>B-</option>
                        <option>AB+</option>
                        <option>AB-</option>
                        <option>O+</option>
                        <option>O-</option>

                    </select>

                </div>

                <div>

                    <label>Phone Number</label>

                    <input type="tel"
                           id="phone">

                </div>

                <div>

                    <label>Email</label>

                    <input type="email"
                           id="email">

                </div>

                <div>

                    <label>Emergency Contact</label>

                    <input type="tel"
                           id="emergencyContact">

                </div>

                <div>

                    <label>Height (cm)</label>

                    <input type="number"
                           id="height">

                </div>

                <div>

                    <label>Weight (kg)</label>

                    <input type="number"
                           id="weight">

                </div>

                <div>

                    <label>Primary Doctor</label>

                    <input type="text"
                           id="doctor">

                </div>

                <div>

                    <label>Hospital / Clinic</label>

                    <input type="text"
                           id="hospital">

                </div>

            </div>

            <!-- Large Fields -->

            <label>Address</label>

            <textarea id="address"
                      rows="3"></textarea>

            <label>Known Allergies</label>

            <textarea id="allergies"
                      rows="3"></textarea>

            <label>Medical History</label>

            <textarea id="history"
                      rows="4"></textarea>

            <label>Current Medications</label>

            <textarea id="medications"
                      rows="4"></textarea>

            <label>Notes</label>

            <textarea id="notes"
                      rows="3"></textarea>

            <button type="submit">

                Save Patient

            </button>

        </form>

    </div>

</div>

<script type="module" src="add-patient.js"></script>

</body>

</html>
