<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Patient Profile</title>

<link rel="stylesheet" href="style1.css">

</head>

<body>

<div class="container">

<h1>Patient Profile</h1>

<form id="patientForm">

<input
type="text"
id="name"
placeholder="Full Name"
required>

<input
type="number"
id="age"
placeholder="Age"
required>

<select id="gender">

<option>Male</option>

<option>Female</option>

<option>Other</option>

</select>

<input
type="text"
id="bloodGroup"
placeholder="Blood Group">

<input
type="tel"
id="phone"
placeholder="Phone Number">

<input
type="text"
id="emergencyContact"
placeholder="Emergency Contact">

<textarea
id="address"
placeholder="Address"></textarea>

<textarea
id="allergies"
placeholder="Allergies"></textarea>

<textarea
id="medicalHistory"
placeholder="Medical History"></textarea>

<input
type="file"
id="profilePhoto"
accept="image/*">

<button type="submit">

Save Patient

</button>

</form>

</div>

<script type="module" src="patient-profile.js"></script>

</body>

</html>
