<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MediScript | Forgot Password</title>

<link rel="stylesheet" href="style1.css">

<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

</head>

<body>

<div class="container">

    <div class="card">

       <!-- <img src="images/logo.png" class="logo" alt="MediScript"> -->

        <h1>Forgot Password</h1>

        <p>
            Enter your registered email address.<br>
            We'll send you a password reset link.
        </p>

        <form id="forgotForm">

            <div class="inputBox">

                <span class="material-icons">email</span>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter Email Address"
                    required>

            </div>

            <button type="submit" id="resetBtn">

                Send Reset Link

            </button>

        </form>

        <div id="message"></div>

        <hr>

        <div class="links">

            <a href="login.html">

                ← Back to Login

            </a>

        </div>

    </div>

</div>

<script type="module" src="js/forgot.js"></script>

</body>

</html>
